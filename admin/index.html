<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel | Fernanda Santos</title>
<meta name="theme-color" content="#0d1b2a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Tela de espera: fica até a conferência da sessão terminar. O painel só aparece depois. -->
<div id="espera" class="espera">Conferindo o seu acesso...</div>

<div id="app" hidden>
  <aside class="menu" id="menu" aria-label="Menu do painel">
    <div class="marca">Fernanda Santos</div>
    <nav>
      <p class="grupo">Meu site</p>
      <button class="item" data-aba="portfolio"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5"/></svg>Portfólio</button>
      <button class="item" data-aba="marcas"><svg viewBox="0 0 24 24"><path d="M4 21V8l8-5 8 5v13M9 21v-6h6v6"/></svg>Marcas</button>
      <button class="item" data-aba="prospeccao"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5M17 5.5a3 3 0 010 5.5M19 14.5c1.5.8 2.3 2.4 2.5 4.5"/></svg>Prospecção</button>
      <p class="grupo">Minha rotina</p>
      <button class="item" data-aba="calendario"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendário</button>
      <button class="item" data-aba="campanhas"><svg viewBox="0 0 24 24"><path d="M3 11v3l14 5V6L3 11zM17 8a4 4 0 010 8M6 15l1 5h3l-1-4"/></svg>Campanhas</button>
      <button class="item" data-aba="checklist"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"/></svg>Checklist portfólio</button>
    </nav>
    <div class="rodape">
      <span class="email" id="emailUser"></span>
      <button class="sair" id="sair"><svg viewBox="0 0 24 24"><path d="M9 4H5a2 2 0 00-2 2v12a2 2 0 002 2h4M16 8l4 4-4 4M20 12H9"/></svg>Sair</button>
    </div>
  </aside>
  <div class="fundo" id="fundo"></div>

  <div class="conteudo">
    <header class="topo">
      <button class="hamb" id="hamb" aria-label="Abrir menu" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 id="titulo">Portfólio</h1>
      <a class="ver-site" href="../" target="_blank" rel="noopener">Ver meu site</a>
    </header>
    <div id="avisos"></div>
    <main id="painel" tabindex="-1"></main>
  </div>
</div>

<div id="modalRaiz"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/banco.js"></script>
<script src="../js/biblioteca.js"></script>
<script src="admin.js"></script>
</body>
</html>
